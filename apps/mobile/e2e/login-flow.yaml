appId: com.cibi.metsys
---
# Login: sign in with the prepared test account and land on the workspace.
- launchApp
- assertVisible: "Sign in"
- tapOn:
    id: "Email"
- inputText: "ui-admin@metsys.test"
- tapOn:
    id: "Password"
- inputText: "e2e-password"
- tapOn: "Sign in"
- assertVisible: "Home"
